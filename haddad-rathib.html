
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">

<title>HADDAD RATHIB | NOOR</title>

<style>
:root {
  --bg:#080808;
  --panel:#151515;
  --gold:#dfba61;
  --cream:#f8f3e8;
  --muted:#aaa;
  --line:#39342a;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:radial-gradient(ellipse at top,#211b0d 0,#080808 55%);
  color:var(--cream);
  font-family:system-ui,sans-serif;
  min-height:100vh;
}

header {
  text-align:center;
  padding:20px 14px 16px;
  border-bottom:1px solid var(--line);
}

.logo {
  color:var(--gold);
  font-size:12px;
  font-weight:800;
  letter-spacing:5px;
}

h1 {
  color:var(--gold);
  font-size:24px;
  margin:9px 0 4px;
}

.subtitle {
  color:var(--muted);
  font-size:12px;
}

.container {
  max-width:850px;
  margin:auto;
  padding:14px 12px 30px;
}

button {
  font:inherit;
  cursor:pointer;
}

.back {
  width:100%;
  padding:12px;
  margin-bottom:12px;
  background:var(--panel);
  color:var(--gold);
  border:1px solid var(--line);
  border-radius:12px;
  font-weight:700;
}

.toolbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  margin-bottom:10px;
}

.toolbar button {
  background:#0b0b0b;
  color:var(--gold);
  border:1px solid #5c4b29;
  border-radius:9px;
  padding:9px 12px;
  font-weight:700;
}

.toolbar button:disabled {
  opacity:.35;
  cursor:not-allowed;
}

.page-info {
  color:var(--cream);
  font-size:13px;
  font-weight:650;
  text-align:center;
}

.viewer {
  background:#252525;
  border:1px solid var(--line);
  border-radius:12px;
  min-height:450px;
  padding:8px;
  overflow:auto;
  text-align:center;
}

#pdfCanvas {
  display:block;
  margin:0 auto;
  max-width:100%;
  height:auto;
  background:white;
  box-shadow:0 3px 18px #0008;
}

.status {
  color:var(--muted);
  text-align:center;
  font-size:13px;
  padding:18px 8px;
}

.error {
  color:#ff9999;
}

.footer {
  text-align:center;
  color:#777;
  font-size:11px;
  padding:20px 10px;
}
</style>
</head>

<body>

<header>
  <div class="logo">NOOR • نور</div>
  <h1>HADDAD RATHIB</h1>
  <div class="subtitle">رَاتِبُ الْحَدَّاد</div>
</header>

<main class="container">

  <button class="back" onclick="goBack()">
    ← Back to MORE
  </button>

  <div class="toolbar">
    <button id="prevBtn" onclick="changePage(-1)" disabled>
      ← Previous
    </button>

    <span class="page-info" id="pageInfo">
      Loading PDF...
    </span>

    <button id="nextBtn" onclick="changePage(1)" disabled>
      Next →
    </button>
  </div>

  <div class="toolbar">
    <button onclick="zoomOut()">− Zoom</button>
    <span class="page-info" id="zoomInfo">100%</span>
    <button onclick="zoomIn()">+ Zoom</button>
  </div>

  <div class="viewer">
    <div class="status" id="status">
      Loading Haddad Rathib...
    </div>

    <canvas id="pdfCanvas"></canvas>
  </div>

  <div class="toolbar">
    <button onclick="goFirst()">First Page</button>
    <button onclick="goLast()">Last Page</button>
  </div>

  <div class="footer">
    NOOR ISLAMIC • HADDAD RATHIB
  </div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
const PDF_URL = "./haddad-rathib.pdf";

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let pdfDoc = null;
let currentPage = 1;
let zoom = 1;
let renderTask = null;

const canvas = document.getElementById("pdfCanvas");
const ctx = canvas.getContext("2d");

const statusBox = document.getElementById("status");
const pageInfo = document.getElementById("pageInfo");
const zoomInfo = document.getElementById("zoomInfo");

async function loadPDF() {
  try {
    const loadingTask = pdfjsLib.getDocument(PDF_URL);

    pdfDoc = await loadingTask.promise;

    statusBox.style.display = "none";

    currentPage = 1;
    zoom = 1;

    await renderPage();

  } catch(error) {
    console.error(error);

    statusBox.style.display = "block";
    statusBox.className = "status error";
    statusBox.textContent =
      "Unable to load PDF. Please check your internet connection and PDF file.";
  }
}

async function renderPage() {
  if (!pdfDoc) return;

  if (renderTask) {
    try {
      renderTask.cancel();
    } catch(e) {}
  }

  try {
    const page = await pdfDoc.getPage(currentPage);

    const viewer = document.querySelector(".viewer");

    const baseViewport = page.getViewport({scale:1});

    const availableWidth = Math.max(
      250,
      viewer.clientWidth - 18
    );

    const fitScale = availableWidth / baseViewport.width;

    const scale = fitScale * zoom;

    const viewport = page.getViewport({scale});

    const pixelRatio = Math.min(
      window.devicePixelRatio || 1,
      2
    );

    canvas.width = Math.floor(viewport.width * pixelRatio);
    canvas.height = Math.floor(viewport.height * pixelRatio);

    canvas.style.width = viewport.width + "px";
    canvas.style.height = viewport.height + "px";

    const transform = pixelRatio !== 1
      ? [pixelRatio,0,0,pixelRatio,0,0]
      : null;

    renderTask = page.render({
      canvasContext:ctx,
      viewport:viewport,
      transform:transform
    });

    await renderTask.promise;

    pageInfo.textContent =
      "Page " + currentPage + " / " + pdfDoc.numPages;

    zoomInfo.textContent =
      Math.round(zoom * 100) + "%";

    document.getElementById("prevBtn").disabled =
      currentPage <= 1;

    document.getElementById("nextBtn").disabled =
      currentPage >= pdfDoc.numPages;

    document.querySelectorAll(".toolbar")[0]
      .scrollIntoView({block:"nearest",behavior:"smooth"});

  } catch(error) {
    if (error.name !== "RenderingCancelledException") {
      console.error(error);
    }
  }
}

function changePage(amount) {
  if (!pdfDoc) return;

  const next = currentPage + amount;

  if (next < 1 || next > pdfDoc.numPages) return;

  currentPage = next;
  renderPage();
}

function zoomIn() {
  zoom = Math.min(2.5,zoom + 0.15);
  renderPage();
}

function zoomOut() {
  zoom = Math.max(0.65,zoom - 0.15);
  renderPage();
}

function goFirst() {
  currentPage = 1;
  renderPage();
}

function goLast() {
  if (!pdfDoc) return;

  currentPage = pdfDoc.numPages;
  renderPage();
}

function goBack() {
  if (
    document.referrer &&
    new URL(document.referrer).origin === location.origin
  ) {
    history.back();
  } else {
    location.href = "./index.html";
  }
}

window.addEventListener("resize",() => {
  if (pdfDoc) renderPage();
});

loadPDF();
</script>

</body>
</html>
