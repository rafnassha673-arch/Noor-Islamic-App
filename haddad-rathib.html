
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">

<title>HADDAD RATHIB | NOOR</title>

<style>
:root {
  --bg:#080808;
  --panel:#151515;
  --gold:#dfba61;
  --cream:#f8f3e8;
  --muted:#aaa;
  --line:#39342a;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:radial-gradient(ellipse at top,#211b0d 0,#080808 55%);
  color:var(--cream);
  font-family:system-ui,sans-serif;
  min-height:100vh;
}

header {
  text-align:center;
  padding:20px 14px 16px;
  border-bottom:1px solid var(--line);
}

.logo {
  color:var(--gold);
  font-size:12px;
  font-weight:800;
  letter-spacing:5px;
}

h1 {
  color:var(--gold);
  font-size:24px;
  margin:9px 0 4px;
}

.subtitle {
  color:var(--muted);
  font-size:12px;
}

.container {
  max-width:900px;
  margin:auto;
  padding:14px 12px 25px;
}

button,a {
  font:inherit;
}

button {
  cursor:pointer;
}

.back {
  display:block;
  width:100%;
  padding:12px;
  margin-bottom:12px;
  background:var(--panel);
  color:var(--gold);
  border:1px solid var(--line);
  border-radius:12px;
  font-weight:700;
}

.info {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
  font-size:12px;
  color:var(--muted);
  line-height:1.7;
  text-align:center;
}

.actions {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-bottom:12px;
}

.action {
  padding:11px 7px;
  background:#151515;
  color:var(--gold);
  border:1px solid #5c4b29;
  border-radius:10px;
  font-weight:650;
  font-size:13px;
  text-decoration:none;
  text-align:center;
}

.viewer {
  width:100%;
  height:calc(100vh - 260px);
  min-height:480px;
  background:#222;
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
}

.viewer iframe {
  display:block;
  width:100%;
  height:100%;
  border:0;
  background:#fff;
}

.fallback {
  text-align:center;
  padding:16px 10px;
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
}

.fallback a {
  color:var(--gold);
}

.footer {
  text-align:center;
  color:#777;
  font-size:11px;
  padding:20px 10px;
}

@media(max-width:400px) {
  .viewer {
    height:calc(100vh - 270px);
    min-height:420px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">NOOR • نور</div>
  <h1>HADDAD RATHIB</h1>
  <div class="subtitle">رَاتِبُ الْحَدَّاد</div>
</header>

<main class="container">

  <button class="back" onclick="goBack()">
    ← Back to MORE
  </button>

  <div class="info">
    Original Haddad Rathib PDF<br>
    12 Pages · Original Arabic Text
  </div>

  <div class="actions">

    <a
      class="action"
      href="./haddad-rathib.pdf"
      target="_blank"
      rel="noopener"
    >
      ↗ Open PDF
    </a>

    <a
      class="action"
      href="./haddad-rathib.pdf"
      download="haddad-rathib.pdf"
    >
      ↓ Download PDF
    </a>

  </div>

  <div class="viewer">

    <iframe
      src="./haddad-rathib.pdf#toolbar=1&navpanes=0&view=FitH"
      title="Haddad Rathib Original PDF"
      loading="eager"
    ></iframe>

  </div>

  <div class="fallback">
    PDF കാണാൻ കഴിയുന്നില്ലെങ്കിൽ
    <a href="./haddad-rathib.pdf" target="_blank" rel="noopener">
      ഇവിടെ അമർത്തി PDF തുറക്കുക
    </a>.
  </div>

  <div class="footer">
    NOOR ISLAMIC • HADDAD RATHIB
  </div>

</main>

<script>
function goBack() {
  if (
    document.referrer &&
    new URL(document.referrer).origin === location.origin
  ) {
    history.back();
  } else {
    location.href = "./index.html";
  }
}
</script>

</body>
</html>
